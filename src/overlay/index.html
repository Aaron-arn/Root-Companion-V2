<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>Root Companion</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="root-sprite" class="root-sprite" data-state="idle">
            <img id="root-img" src="../../asset/root-idle.png" alt="Root" draggable="false" />
            <div id="root-label" class="root-label">Root</div>
        </div>
        <div id="root-controls" class="root-controls hidden">
            <button id="ctrl-chat" class="ctrl-btn" title="Parler">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </button>
            <button id="ctrl-roam" class="ctrl-btn active" title="Promenade: ON">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="5" cy="18" r="1.5" />
                    <circle cx="18" cy="18" r="1.5" />
                    <path d="M5 18v-4h6l2-4h4" />
                </svg>
            </button>
            <button id="ctrl-sleep" class="ctrl-btn" title="Dormir">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button id="ctrl-settings" class="ctrl-btn" title="Parametres">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82a2 2 0 0 1-2.83 2.83a1.65 1.65 0 0 0-1.82-.33V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33a2 2 0 0 1-2.83-2.83A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82a2 2 0 0 1 2.83-2.83A1.65 1.65 0 0 0 9 4.68V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 .5a1.65 1.65 0 0 0 1.82-.33a2 2 0 0 1 2.83 2.83A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.5 1z" />
                </svg>
            </button>
        </div>
        <div id="chat-bubble" class="chat-bubble hidden">
            <div class="chat-header">
                <span class="chat-title">ROOT</span>
                <div class="chat-head-btns">
                    <button id="chat-history-btn" class="chat-history-btn" title="Historique">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                    </button>
                    <button id="chat-close" class="chat-close">✕</button>
                </div>
            </div>
            <div id="chat-history-panel" class="chat-history-panel hidden">
                <div class="history-head">
                    <span>Historique</span>
                    <button id="chat-history-close" class="chat-close">✕</button>
                </div>
                <div id="chat-history-list" class="chat-history-list"></div>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="msg root">
                    <span class="author">Root</span>
                    <span class="text">Salut ! Moi c'est Root ton assistant ia, hesite pas a m'écrire </span>
                </div>
            </div>
            <div id="attach-preview" class="attach-preview hidden"></div>
            <div class="chat-input-row">
                <button id="attach-btn" class="attach-btn" title="Joindre">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
                <input id="chat-input" class="chat-input" placeholder="Ecris a Root..." autocomplete="off" />
                <button id="chat-send" class="chat-send">➤</button>
            </div>
            <div id="attach-menu" class="attach-menu hidden">
                <button class="attach-option" data-action="screen">Capture écran</button>
                <button class="attach-option" data-action="window">Capture fenêtre</button>
                <button class="attach-option" data-action="zone">Capture zone</button>
                <button class="attach-option" data-action="file">Fichier</button>
            </div>
        </div>
        <div id="sleep-bubble" class="sleep-bubble hidden">
            <img src="../../asset/root-sleep.png" class="sleep-icon" alt="sleep" />
            <div class="sleep-text">
                <span class="sleep-title">Root dort...</span>
                <span class="sleep-sub">Chut il se repose</span>
            </div>
            <button id="sleep-wake-btn" class="sleep-wake">Reveiller</button>
            <button id="sleep-hide-btn" class="sleep-hide">﹀</button>
        </div>
        <div id="sleep-pill" class="sleep-pill hidden" title="Root dort - clique">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFB400" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </div>
        <div id="notif-bubble" class="notif-bubble hidden">
            <img src="../../asset/root-sleep.png" class="sleep-icon" alt="sleep" />
            <div class="sleep-text">
                <span class="sleep-title">Root dort profondement</span>
                <span class="sleep-sub">Clique pour le reveiller</span>
            </div>
            <button id="notif-close" class="sleep-hide">✕</button>
        </div>
        <script src="pet.js"></script>
        <script src="renderer.js"></script>
    </body>
</html>
