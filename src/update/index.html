<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>Mise à jour</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background: #1e1e28;
                color: #e0e0e0;
                font-family: "Segoe UI", Arial, sans-serif;
            }
            .loader {
                width: 48px;
                height: 48px;
                border: 4px solid #333;
                border-top-color: #ff6600;
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            h1 {
                margin-top: 18px;
                font-size: 14px;
                color: #ff6600;
                letter-spacing: 1px;
            }
            p {
                margin-top: 8px;
                font-size: 11px;
                color: #999;
            }
            .bar {
                margin-top: 14px;
                width: 220px;
                height: 6px;
                background: #0f0f14;
                border: 1px solid #333;
                overflow: hidden;
            }
            .fill {
                height: 100%;
                width: 0%;
                background: #ff6600;
                animation: fill 2.2s ease-in-out infinite;
            }
            @keyframes fill {
                0% {
                    width: 0%;
                }
                50% {
                    width: 85%;
                }
                100% {
                    width: 0%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader"></div>
        <h1>Téléchargement en cours</h1>
        <p>Mise à jour de Root...</p>
        <div class="bar"><div class="fill"></div></div>
    </body>
</html>
